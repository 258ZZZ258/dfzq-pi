name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-check-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DFZQ_AUDIT_AI_PYTHON: ${{ github.workspace }}/services/audit-ai/.venv/bin/python
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.2
          cache: npm

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Install embedded service
        run: |
          python -m venv services/audit-ai/.venv
          "$DFZQ_AUDIT_AI_PYTHON" -m pip install -c services/audit-ai/constraints.txt \
            -e services/audit-ai/libs/common -e services/audit-ai/pipeline \
            -e services/audit-ai/query -e services/audit-ai/eval -e 'services/audit-ai[dev]'

      # Deployment runs native TypeScript with pinned installed Pi artifacts.
      # Upstream source builds generate a mutable external model catalog and are
      # not the deployed product. Match the intranet image's production boundary.
      - name: Check production code and repository metadata
        run: |
          npx biome check --error-on-warnings .
          npm run check:pinned-deps
          npm run check:ts-imports
          npm run check:shrinkwrap
          npm run check:install-lock:coding-agent
          npm run check:browser-smoke
          npm run check:production --workspace=@dfzq/task-runtime
          npm run audit-ai:check

      - name: Test production runtime
        run: npm run test:production --workspace=@dfzq/task-runtime

      - name: Test embedded service offline
        run: npm run audit-ai:test
